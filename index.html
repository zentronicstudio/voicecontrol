<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice Control</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    .card {
      background: white;
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    .mic {
      width: 140px;
      height: 140px;
      border: none;
      border-radius: 50%;
      background: #111827;
      color: white;
      font-size: 55px;
      cursor: pointer;
    }

    .mic:active {
      transform: scale(0.95);
    }

    .listening {
      background: #dc2626;
    }

    #status {
      margin-top: 25px;
      font-size: 22px;
      font-weight: bold;
    }

    #speech {
      margin-top: 15px;
      min-height: 35px;
      font-size: 20px;
      color: #374151;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      background: #f3f4f6;
      border-radius: 15px;
    }

    #command {
      font-size: 24px;
      font-weight: bold;
    }

    #firebaseStatus {
      margin-top: 15px;
      font-size: 14px;
      color: #6b7280;
    }

    .help {
      margin-top: 25px;
      font-size: 15px;
      line-height: 1.8;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Voice Control</h1>

    <div class="card">

      <button
        class="mic"
        id="micButton"
        onclick="startListening()">
        🎤
      </button>

      <div id="status">
        Tap microphone
      </div>

      <div id="speech">
        -
      </div>

      <div class="result">

        <div>
          COMMAND
        </div>

        <br>

        <div id="command">
          -
        </div>

      </div>

      <div id="firebaseStatus">
        Connecting Firebase...
      </div>

      <div class="help">
        Say:<br>
        Switch one on<br>
        Switch one off<br>
        Switch two on<br>
        Switch two off
      </div>

    </div>

  </div>


  <script type="module">

    // =====================================================
    // FIREBASE IMPORT
    // =====================================================

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      signInAnonymously
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    import {
      getDatabase,
      ref,
      set
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    // =====================================================
    // FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyBUL94M7hwuMFn19xzRP4MXhv1_ENIK4t0",

      authDomain:
        "voice-command-9a039.firebaseapp.com",

      databaseURL:
        "https://voice-command-9a039-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "voice-command-9a039",

      storageBucket:
        "voice-command-9a039.firebasestorage.app",

      messagingSenderId:
        "38586778701",

      appId:
        "1:38586778701:web:5061e097bf3124e1cc8804"
    };


    // =====================================================
    // FIREBASE START
    // =====================================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const database =
      getDatabase(app);

    let firebaseReady =
      false;


    // =====================================================
    // HTML ELEMENTS
    // =====================================================

    const statusText =
      document.getElementById("status");

    const speechText =
      document.getElementById("speech");

    const commandText =
      document.getElementById("command");

    const micButton =
      document.getElementById("micButton");

    const firebaseStatus =
      document.getElementById("firebaseStatus");


    // =====================================================
    // FIREBASE LOGIN
    // =====================================================

    signInAnonymously(auth)

    .then(() => {

      firebaseReady =
        true;

      firebaseStatus.innerText =
        "Firebase Connected";

      console.log(
        "Firebase anonymous login success"
      );

    })

    .catch((error) => {

      firebaseReady =
        false;

      firebaseStatus.innerText =
        "Firebase Error";

      console.error(
        "Firebase login error:",
        error
      );

    });


    // =====================================================
    // SEND COMMAND
    // =====================================================

    async function sendCommand(command) {

      if (!firebaseReady) {

        firebaseStatus.innerText =
          "Firebase not connected";

        return;
      }


      try {

        const commandRef =
          ref(
            database,
            "control"
          );


        // IMPORTANT:
        // command_id is STRING
        //
        // Example:
        // CMD_1788895127525

        const commandID =
          "CMD_" +
          Date.now().toString();


        await set(
          commandRef,
          {

            command:
              command,

            command_id:
              commandID

          }
        );


        firebaseStatus.innerText =
          "Sent: " + command;


        console.log(
          "Command:",
          command
        );


        console.log(
          "Command ID:",
          commandID
        );

      }

      catch(error) {

        firebaseStatus.innerText =
          "Firebase write failed";


        console.error(
          "Firebase write error:",
          error
        );

      }
    }


    // =====================================================
    // SPEECH RECOGNITION
    // =====================================================

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition;


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();


      recognition.lang =
        "en-US";


      recognition.continuous =
        false;


      recognition.interimResults =
        false;


      // ===================================================
      // START LISTENING
      // ===================================================

      recognition.onstart =
      function() {

        statusText.innerText =
          "LISTENING...";

        speechText.innerText =
          "...";

        commandText.innerText =
          "-";

        micButton.classList.add(
          "listening"
        );
      };


      // ===================================================
      // RESULT
      // ===================================================

      recognition.onresult =
      function(event) {

        let text =
          event
          .results[0][0]
          .transcript
          .toLowerCase()
          .trim();


        speechText.innerText =
          text;


        processCommand(
          text
        );
      };


      // ===================================================
      // ERROR
      // ===================================================

      recognition.onerror =
      function(event) {

        statusText.innerText =
          "ERROR: " +
          event.error;


        micButton.classList.remove(
          "listening"
        );
      };


      // ===================================================
      // END
      // ===================================================

      recognition.onend =
      function() {

        micButton.classList.remove(
          "listening"
        );


        if (
          statusText.innerText ===
          "LISTENING..."
        ) {

          statusText.innerText =
            "Tap microphone";
        }
      };
    }

    else {

      statusText.innerText =
        "Speech recognition not supported";
    }


    // =====================================================
    // START MIC BUTTON
    // =====================================================

    window.startListening =
    function() {

      if (!recognition) {

        return;
      }


      try {

        recognition.start();

      }

      catch(error) {

        console.log(error);

      }
    };


    // =====================================================
    // PROCESS VOICE
    // =====================================================

    function processCommand(text) {

      text =
        text
        .toLowerCase()
        .trim();


      // ===================================================
      // NORMALIZE "ONE"
      // ===================================================

      text =
        text.replace(
          /\bswitch 1\b/g,
          "switch one"
        );


      text =
        text.replace(
          /\bswitch won\b/g,
          "switch one"
        );


      // ===================================================
      // NORMALIZE "TWO"
      // ===================================================

      text =
        text.replace(
          /\bswitch 2\b/g,
          "switch two"
        );


      text =
        text.replace(
          /\bswitch to\b/g,
          "switch two"
        );


      text =
        text.replace(
          /\bswitch too\b/g,
          "switch two"
        );


      // ===================================================
      // SWITCH 1 ON
      // ===================================================

      if (
        text.includes(
          "switch one on"
        )
      ) {

        statusText.innerText =
          "COMMAND RECOGNIZED";


        commandText.innerText =
          "SWITCH 1 ON";


        sendCommand(
          "SWITCH_1_ON"
        );
      }


      // ===================================================
      // SWITCH 1 OFF
      // ===================================================

      else if (
        text.includes(
          "switch one off"
        )
      ) {

        statusText.innerText =
          "COMMAND RECOGNIZED";


        commandText.innerText =
          "SWITCH 1 OFF";


        sendCommand(
          "SWITCH_1_OFF"
        );
      }


      // ===================================================
      // SWITCH 2 ON
      // ===================================================

      else if (
        text.includes(
          "switch two on"
        )
      ) {

        statusText.innerText =
          "COMMAND RECOGNIZED";


        commandText.innerText =
          "SWITCH 2 ON";


        sendCommand(
          "SWITCH_2_ON"
        );
      }


      // ===================================================
      // SWITCH 2 OFF
      // ===================================================

      else if (
        text.includes(
          "switch two off"
        )
      ) {

        statusText.innerText =
          "COMMAND RECOGNIZED";


        commandText.innerText =
          "SWITCH 2 OFF";


        sendCommand(
          "SWITCH_2_OFF"
        );
      }


      // ===================================================
      // UNKNOWN
      // ===================================================

      else {

        statusText.innerText =
          "COMMAND NOT RECOGNIZED";


        commandText.innerText =
          "-";
      }
    }

  </script>

</body>
</html>
